name: Kaixinguo Debug

on:
  push:
    branches: [feature/reels-first-step]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 37.0
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
          # Some AGP versions still search for android-37 without the .0 suffix.
          if [ ! -e "${ANDROID_HOME}/platforms/android-37" ]; then
            ln -s android-37.0 "${ANDROID_HOME}/platforms/android-37"
          fi
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and Debug APK only
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: kaixinguo-reels-arm64-debug
          path: app/build/outputs/apk/debug/*arm64-v8a*.apk
          if-no-files-found: error
